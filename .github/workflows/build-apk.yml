name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/shinek/platform
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'GRADLE'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "SHineK"
          include ':app'
          GRADLE

          cat > build.gradle << 'GRADLE'
          plugins {
            id 'com.android.application' version '8.1.4' apply false
          }
          GRADLE

          cat > app/build.gradle << 'GRADLE'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.shinek.platform'
            compileSdk 34
            defaultConfig {
              applicationId 'com.shinek.platform'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.debug
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="SHine-K"
              android:allowBackup="true"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          cat > app/src/main/java/com/shinek/platform/MainActivity.java << 'JAVA'
          package com.shinek.platform;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              webView = new WebView(this);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              webView.setWebChromeClient(new WebChromeClient());
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("https://yi123456hj-sys.github.io/shine-k-platform/website/");
              setContentView(webView);
            }
            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          JAVA

          cat > app/src/main/res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="colorPrimary">#FF6B35</item>
              <item name="colorPrimaryDark">#E84A10</item>
            </style>
          </resources>
          XML

          cat > gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS

          cat > local.properties << PROPS
          sdk.dir=$ANDROID_SDK_ROOT
          PROPS

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHine-K-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
