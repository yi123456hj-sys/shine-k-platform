name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Create Android project files
        run: |
          mkdir -p app/src/main/java/com/shinek/platform
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "SHineK"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
            id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.shinek.platform'
            compileSdk 34
            defaultConfig {
              applicationId 'com.shinek.platform'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.debug
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="SHine-K" android:allowBackup="true"
              android:theme="@style/AppTheme" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat > app/src/main/java/com/shinek/platform/MainActivity.java << 'EOF'
          package com.shinek.platform;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.net.Uri;
          public class MainActivity extends Activity {
            private WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setWebChromeClient(new WebChromeClient());
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, String url) {
                  v.loadUrl(url); return true;
                }
              });
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
            @Override public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="colorPrimary">#FF6B35</item>
            </style>
          </resources>
          EOF

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>&1 | grep -v "^\[=" | tail -3

      - name: Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -20

      - name: Copy APK to website folder and commit
        run: |
          mkdir -p download
          cp app/build/outputs/apk/release/app-release.apk download/SHine-K.apk

          # Add a download page
          cat > download/index.html << 'DLHTML'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>SHine-K 下载</title>
          <style>
            body{font-family:system-ui,sans-serif;text-align:center;padding:40px 20px;background:#1A0F08;color:#fff}
            h1{color:#FF6B35;font-size:2rem;margin-bottom:10px}
            p{color:#ccc;margin-bottom:30px}
            a{display:inline-block;background:#FF6B35;color:#fff;padding:16px 40px;border-radius:12px;text-decoration:none;font-size:1.1rem;font-weight:700}
            a:hover{background:#E84A10}
            .note{font-size:.85rem;color:#888;margin-top:20px}
          </style>
          </head>
          <body>
          <h1>SHine-K</h1>
          <p>工业安全 AI 平台 · 安卓版</p>
          <a href="SHine-K.apk" download>⬇️ 下载 APK</a>
          <p class="note">安装前请开启"允许未知来源"</p>
          </body>
          </html>
          DLHTML

          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add download/
          git diff --staged --quiet || git commit -m "ci: update APK download"
          git push
